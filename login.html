<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign In | CeylonAdmin Portal</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css?v=7.0">
  <link rel="stylesheet" href="./css/reset.css?v=7.0">
  <link rel="stylesheet" href="./css/typography.css?v=7.0">
  <link rel="stylesheet" href="./css/layout.css?v=7.0">
  <link rel="stylesheet" href="./css/components.css?v=7.0">
  <link rel="stylesheet" href="./css/pages.css?v=7.0">

  <style>
    body {
      background: #0f172a;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      font-family: var(--font-body);
      color: #1e293b;
      margin: 0;
      position: relative;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    .login-card {
      background: #ffffff;
      border-radius: var(--radius-xl);
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .login-logo {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      text-decoration: none;
    }

    .login-logo span {
      color: #0f6e56;
    }

    .login-subtitle {
      font-size: 0.8125rem;
      color: #64748b;
      margin-top: 0.35rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.35rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 0.875rem;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 16px !important; /* Prevents auto-zoom on iOS Safari */
      color: #0f172a;
      background: #ffffff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: #0f6e56;
      box-shadow: 0 0 0 3px rgba(15, 110, 86, 0.15);
    }

    .login-error {
      display: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.8125rem;
      margin-bottom: 1.25rem;
      text-align: center;
      border: 1px solid #fca5a5;
    }

    .btn-login {
      width: 100%;
      padding: 0.875rem;
      background: #0f6e56;
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      background: #0b5341;
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #94a3b8;
      font-size: 0.8125rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-home:hover {
      color: #ffffff;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 1.75rem 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <a href="./index.html" class="login-logo">
          Ceylon<span>Admin</span>
        </a>
        <p class="login-subtitle">Operations & Tour Management Portal</p>
      </div>

      <form id="login-form">
        <div id="login-error-msg" class="login-error"></div>

        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input 
            type="text" 
            id="login-username" 
            class="form-input" 
            placeholder="e.g. admin" 
            autocomplete="username" 
            autocapitalize="none" 
            autocorrect="off" 
            spellcheck="false" 
            required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            class="form-input" 
            placeholder="••••••••" 
            autocomplete="current-password" 
            autocapitalize="none" 
            autocorrect="off" 
            spellcheck="false" 
            required>
        </div>

        <button type="submit" class="btn-login" id="btn-login-submit">
          Sign In to Portal
        </button>
      </form>
    </div>

    <a href="./index.html" class="back-home">&larr; Back to Public Website</a>
  </div>

  <script type="module">
    import { loginAdmin, isAuthenticated } from './js/api.js';

    // If already authenticated, redirect straight to dashboard
    if (isAuthenticated()) {
      window.location.replace('./admin.html');
    }

    const loginForm = document.getElementById('login-form');
    const errBox = document.getElementById('login-error-msg');
    const submitBtn = document.getElementById('btn-login-submit');
    const usernameInput = document.getElementById('login-username');
    const passwordInput = document.getElementById('login-password');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput ? usernameInput.value.trim() : '';
      const pass = passwordInput ? passwordInput.value.trim() : '';

      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        await loginAdmin(username, pass);
        // On success, smoothly forward to dashboard
        window.location.replace('./admin.html');
      } catch (err) {
        errBox.textContent = err.message || 'Invalid username or password. Please try again.';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Portal';
      }
    });
  </script>
</body>
</html>
